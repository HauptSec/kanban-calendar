services:
  weekboard:
    build: .
    container_name: weekboard
    ports:
      - "8001:8001"
    environment:
      # Extra names/IPs for the self-signed cert, e.g. "DNS:weekboard.local,IP:192.168.1.50"
      TLS_SAN: ${TLS_SAN:-}
    volumes:
      # Generated cert persists here; replace cert.pem/key.pem with your own to use a real one
      - certs:/etc/nginx/certs
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    container_name: weekboard-api
    volumes:
      # All calendar events (events.json); survives container rebuilds and restarts
      - data:/data
    restart: unless-stopped

volumes:
  certs:
  data:
