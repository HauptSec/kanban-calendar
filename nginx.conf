server {
    listen 8001 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Plain HTTP sent to the HTTPS port: redirect instead of nginx's 400 page
    error_page 497 =301 https://$host:8001$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Re-resolve the api container on each request so a recreated container (new IP) doesn't 502
        resolver 127.0.0.11 valid=10s;
        set $api http://api:8000;
        proxy_pass $api;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
        # Single page that changes on redeploy; always revalidate
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
