<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root {
    --bg: #0e1014;
    --bg-2: #151820;
    --col: #171a22;
    --col-today: #1c2130;
    --line: #262b37;
    --text: #e8eaf0;
    --muted: #8a90a0;
    --accent: #7c9cff;
    --danger: #ff8a8a;
    --glow: #1a2033;
    --btn-hover: #1d212b;
    --btn-hover-line: #333a49;
    --scroll: #2a2f3b;
    --card-base: #191c25;
    --ink: white;            /* card time/checkbox tint mixes toward this */
    --tool-bg: rgba(0,0,0,.35);
    --tool-hover: rgba(0,0,0,.6);
    --shadow: rgba(0,0,0,.35);
    --backdrop: rgba(5,6,10,.6);
    --radius: 14px;
    --font: "Inter", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7;
    --bg-2: #ffffff;
    --col: #ffffff;
    --col-today: #eef2ff;
    --line: #e1e4eb;
    --text: #1a1d26;
    --muted: #6b7280;
    --accent: #5b7cfa;
    --danger: #d64545;
    --glow: #e2e8ff;
    --btn-hover: #f0f2f6;
    --btn-hover-line: #cdd2dc;
    --scroll: #cdd2dc;
    --card-base: #ffffff;
    --ink: #1a1d26;
    --tool-bg: rgba(255,255,255,.75);
    --tool-hover: rgba(255,255,255,1);
    --shadow: rgba(20,25,40,.12);
    --backdrop: rgba(30,35,50,.35);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 10% -10%, var(--glow) 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;  /* no double-tap zoom, so taps respond immediately */
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* Font Awesome 7 draws icons via an :is() rule (Chromium 88+); this plain rule covers older tablet browsers */
  .fa-solid::before { content: var(--fa); }

  /* Header */
  /* Title | clock (centered on the screen) | buttons (right-aligned) */
  header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 16px;
    padding: 20px 28px 12px;
  }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 16px; }
  .btn { white-space: nowrap; }
  .toolbar .group { display: flex; align-items: center; gap: 6px; }
  .title { display: flex; flex-direction: column; }
  .title h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .title span { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .spacer { flex: 1; }
  .clock { text-align: center; }
  .clock .time { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .clock .date { color: var(--muted); font-size: 13px; }
  .btn {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 14px;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--btn-hover); border-color: var(--btn-hover-line); }
  /* Buttons center their content natively; older Chromium can't make a <button> a grid/flex container */
  .btn.icon { width: 38px; height: 38px; padding: 0; text-align: center; line-height: 1; }
  .btn i { pointer-events: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
  .btn.danger { color: var(--danger); }

  /* Board */
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 12px;
    padding: 8px 28px 24px;
  }
  .column {
    background: var(--col);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    transition: background .15s, border-color .15s;
  }
  .column.today { background: var(--col-today); border-color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .column.drag-over { border-color: var(--accent); background: var(--col-today); background: color-mix(in srgb, var(--accent) 8%, var(--col)); }
  .col-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 14px 14px 10px;
  }
  .col-head .dow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .col-head .num { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .today .col-head .dow { color: var(--accent); }
  .col-head .count { margin-left: auto; font-size: 12px; color: var(--muted); }
  .add {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 20px;
    line-height: 1;
    padding: 0 2px;
    transition: opacity .15s, color .15s;
  }
  .add:hover { color: var(--text); }
  .cards {
    flex: 1;
    overflow-y: auto;
    padding: 0 10px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent;
  }

  /* Card */
  .card {
    --c: #7c9cff;
    --c-rgb: 124, 156, 255;  /* set per card from its color; rgba() tints work on old browsers */
    position: relative;
    background: linear-gradient(rgba(var(--c-rgb), .14), rgba(var(--c-rgb), .14)), var(--card-base);
    border: 1px solid rgba(var(--c-rgb), .3);
    border-left: 4px solid var(--c);
    border-radius: 10px;
    padding: 10px 10px 10px 12px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, opacity .2s;
    /* long-press is used for dragging: no text selection or callout menu */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .card.dragging { opacity: .4; }
  .card.ghost {
    position: fixed;
    z-index: 50;
    margin: 0;
    pointer-events: none;
    opacity: .95;
    transform: rotate(2deg) scale(1.03);
    box-shadow: 0 16px 40px var(--shadow);
  }
  .card .check {
    grid-row: span 3;
    appearance: none;
    width: 18px; height: 18px;
    margin: 2px 0 0;
    border: 2px solid var(--c);
    border: 2px solid color-mix(in srgb, var(--c) 70%, var(--ink));
    border-radius: 6px;
    cursor: pointer;
    position: relative;
  }
  .card .check:checked { background: var(--c); border-color: var(--c); }
  .card .check:checked::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px; height: 9px;
    border: solid #0b0d12;
    border-width: 0 2px 2px 0;
    transform: translate(-50%, -60%) rotate(45deg);
  }
  .card .when { font-size: 12px; font-weight: 600; color: var(--c); color: color-mix(in srgb, var(--c) 60%, var(--ink)); font-variant-numeric: tabular-nums; }
  .card .name { font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
  .card .notes { font-size: 12.5px; color: var(--muted); line-height: 1.4; white-space: pre-wrap; overflow-wrap: break-word; }
  .card.done { opacity: .55; }
  .card.done .name, .card.done .when, .card.done .notes { text-decoration: line-through; }
  .card .tools {
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    gap: 2px;
    transition: opacity .15s;
  }
  .tools button, .tools label {
    width: 24px; height: 24px;
    border: none;
    border-radius: 6px;
    background: var(--tool-bg);
    display: grid;
    place-items: center;
    font-size: 12px;
    cursor: pointer;
  }
  .tools button:hover, .tools label:hover { background: var(--tool-hover); }
  .tools input[type=color] { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  .swatch-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid rgba(255,255,255,.7); }

  /* Modal */
  dialog {
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--bg-2);
    color: var(--text);
    padding: 24px;
    width: min(440px, calc(100vw - 32px));
    box-shadow: 0 30px 80px var(--shadow);
  }
  dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(4px); }
  dialog h2 { margin: 0 0 16px; font-size: 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  dialog input, dialog select, dialog textarea {
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }
  dialog input:focus, dialog select:focus, dialog textarea:focus { outline: none; border-color: var(--accent); }
  dialog textarea { resize: vertical; min-height: 64px; }
  .swatches { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .swatches button {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid transparent;
    padding: 0;
  }
  .swatches button.sel { border-color: var(--text); }
  .swatches input[type=color] { width: 34px; height: 30px; padding: 2px; border-radius: 8px; cursor: pointer; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .scope { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .scope label { flex: 1; display: flex; cursor: pointer; }
  .scope span { flex: 1; text-align: center; font-size: 13px; padding: 6px; border-radius: 7px; color: var(--muted); }
  .scope input:checked + span { background: var(--bg-2); color: var(--text); }
  .scope input { display: none; }
  .card .repeat { opacity: .8; margin-left: 4px; }
  .days { display: flex; gap: 6px; }
  .days button {
    flex: 1;
    padding: 7px 0;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
  }
  .days button.sel { background: var(--accent); border-color: var(--accent); color: #0b0d12; font-weight: 600; }
  .card .ev-icon { margin-right: 7px; color: var(--c); color: color-mix(in srgb, var(--c) 75%, var(--ink)); }

  /* Icon dropdown */
  .icon-picker { position: relative; }
  .icon-btn, .icon-opt {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    font-size: 14px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
  }
  .icon-btn[aria-expanded=true] { border-color: var(--accent); }
  .icon-btn:focus-visible { outline: none; border-color: var(--accent); }
  .icon-btn .caret { margin-left: auto; font-size: 11px; color: var(--muted); }
  .icon-slot { width: 18px; text-align: center; color: var(--accent); }
  .icon-menu {
    position: absolute;
    z-index: 10;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    max-height: 300px;
    overflow-y: auto;
    padding: 8px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 16px 40px var(--shadow);
    scrollbar-width: thin;
    scrollbar-color: var(--scroll) transparent;
  }
  .icon-group { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 10px 6px 6px; }
  .icon-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
  .icon-opt { border-color: transparent; background: none; padding: 7px 8px; font-size: 13px; }
  .icon-opt:hover { background: var(--btn-hover); }
  .icon-opt:focus-visible { outline: none; background: var(--btn-hover); }
  .icon-opt[aria-selected=true] { background: var(--btn-hover); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .icon-opt.none { color: var(--muted); }

  .card .years { font-weight: 500; color: var(--muted); }

  /* Templates */
  .dlg-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .dlg-head h2 { margin: 0; }
  .tpl-picker { position: relative; margin-left: auto; }
  .tpl-picker .btn { font-size: 13px; padding: 6px 10px; }
  .tpl-picker .btn i { color: var(--accent); margin-right: 4px; }
  .tpl-menu { left: auto; width: 220px; max-height: 360px; }
  .tpl-box {
    border: 1px solid var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    border-radius: 12px;
    padding: 10px 12px 0;
    margin-bottom: 14px;
  }
  .tpl-title { display: flex; align-items: center; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .tpl-title i { color: var(--accent); margin-right: 8px; }
  .tpl-clear { margin-left: auto; border: none; background: none; color: var(--muted); padding: 2px 4px; }
  .tpl-clear:hover { color: var(--text); }
  .tpl-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .tpl-fields .field:only-child { grid-column: span 2; }

  .offline {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--danger);
    color: #0b0d12;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 10px;
    box-shadow: 0 6px 20px var(--shadow);
  }
  dialog.small { width: min(400px, calc(100vw - 32px)); }
  dialog.small p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }

  /* Mouse: reveal quick tools on hover. Touch: no hover, so tap a card to edit it instead */
  @media (hover: hover) {
    .add { opacity: 0; transition: opacity .15s, color .15s; }
    .column:hover .add { opacity: 1; }
    .card:hover { box-shadow: 0 6px 20px var(--shadow); transform: translateY(-1px); }
    .card .tools { opacity: 0; }
    .card:hover .tools { opacity: 1; }
  }
  @media (hover: none) {
    .card .tools { display: none; }
  }
  /* Finger-sized targets on touchscreens */
  @media (pointer: coarse) {
    .btn { padding: 11px 16px; font-size: 15px; }
    .btn.icon { width: 46px; height: 46px; }
    .toolbar { gap: 20px; }
    .toolbar .group { gap: 8px; }
    .add { font-size: 22px; padding: 4px 8px; margin: -4px -6px -4px 0; }
    .card { padding: 12px 12px 12px 14px; gap: 3px 12px; }
    .card .check { width: 24px; height: 24px; border-radius: 7px; }
    .card .check:checked::after { width: 6px; height: 12px; border-width: 0 3px 3px 0; }
    dialog { padding: 22px; }
    dialog input, dialog select, dialog textarea { font-size: 16px; padding: 11px 12px; }
    dialog::backdrop { backdrop-filter: none; }  /* blur is slow on tablet GPUs */
    .swatches { gap: 10px; }
    .swatches button { width: 36px; height: 36px; }
    .swatches input[type=color] { width: 44px; height: 38px; }
    .icon-btn { padding: 11px 12px; font-size: 15px; }
    .icon-opt { padding: 12px 10px; font-size: 14px; }
    .icon-menu { max-height: 340px; }
    .days button { padding: 12px 0; font-size: 14px; }
    .scope span { padding: 10px; font-size: 14px; }
    .tpl-picker .btn { padding: 9px 12px; }
    .tpl-clear { padding: 8px 10px; margin-right: -8px; }
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-auto-rows: max-content; overflow-y: auto; }
    .column { min-height: 120px; }
    .cards { overflow: visible; }
    /* Narrow: title and clock share the top row, buttons get their own row */
    header { grid-template-columns: minmax(0, 1fr) auto; padding: 16px; row-gap: 12px; }
    .clock { text-align: right; }
    .toolbar { grid-column: 1 / -1; }
    main { padding: 8px 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1 id="weekTitle">This Week</h1>
    <span id="weekRange"></span>
  </div>
  <div class="clock"><div class="time" id="clockTime"></div><div class="date" id="clockDate"></div></div>
  <div class="toolbar">
    <div class="group">
      <button class="btn icon" id="prev" title="Previous week" aria-label="Previous week"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <button class="btn" id="today">Today</button>
      <button class="btn icon" id="next" title="Next week" aria-label="Next week"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
    </div>
    <button class="btn primary" id="newEvent"><i class="fa-solid fa-plus" aria-hidden="true"></i> Event</button>
    <div class="group">
      <button class="btn icon" id="theme" title="Toggle light/dark" aria-label="Toggle light/dark"></button>
      <button class="btn icon" id="fullscreen" title="Toggle full screen" aria-label="Toggle full screen"><i class="fa-solid fa-expand" aria-hidden="true"></i></button>
    </div>
  </div>
</header>

<main id="board"></main>
<div id="offline" class="offline" role="status" hidden>Can't reach the server. Recent changes may not be saved.</div>

<dialog id="editor">
  <form method="dialog" id="form">
    <div class="dlg-head">
      <h2 id="formTitle">New event</h2>
      <div class="tpl-picker" id="tplPicker">
        <button type="button" class="btn" id="tplBtn" aria-haspopup="menu" aria-expanded="false"><i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i> Template</button>
        <div class="icon-menu tpl-menu" id="tplMenu" role="menu" hidden></div>
      </div>
    </div>
    <div class="tpl-box" id="tplBox" hidden>
      <div class="tpl-title"><span id="tplName"></span><button type="button" class="tpl-clear" id="tplClear" title="Remove template"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
      <div class="tpl-fields" id="tplFields"></div>
    </div>
    <div class="field">
      <label id="iconLabel">Icon</label>
      <div class="icon-picker">
        <button type="button" class="icon-btn" id="iconBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="iconLabel iconBtn"></button>
        <div class="icon-menu" id="iconMenu" role="listbox" aria-labelledby="iconLabel" hidden></div>
      </div>
    </div>
    <div class="field">
      <label for="fTitle">Event</label>
      <input id="fTitle" required autocomplete="off" placeholder="Dinner with friends">
    </div>
    <div class="field">
      <label for="fDate">Day</label>
      <input id="fDate" type="date" required>
    </div>
    <div class="row">
      <div class="field"><label for="fStart">Start</label><input id="fStart" type="time"></div>
      <div class="field"><label for="fEnd">End</label><input id="fEnd" type="time"></div>
    </div>
    <div class="row" id="repeatRow">
      <div class="field">
        <label for="fRepeat">Repeat</label>
        <select id="fRepeat">
          <option value="">Never</option>
          <option value="daily">Every day</option>
          <option value="weekdays">Weekdays (Mon-Fri)</option>
          <option value="weekly">Every week</option>
          <option value="biweekly">Every 2 weeks</option>
          <option value="monthly">Every month</option>
          <option value="monthlyNth">Every month</option>
          <option value="monthlyLast">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </div>
      <div class="field" id="untilField"><label for="fUntil">Until (optional)</label><input id="fUntil" type="date"></div>
    </div>
    <div class="field" id="daysField">
      <label>On</label>
      <div class="days" id="days"></div>
    </div>
    <div class="field">
      <label for="fNotes">Details</label>
      <textarea id="fNotes" placeholder="Location, notes..."></textarea>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field" id="scopeField">
      <label>Apply changes to</label>
      <div class="scope">
        <label><input type="radio" name="scope" value="one" checked><span>This event</span></label>
        <label><input type="radio" name="scope" value="all"><span>All events</span></label>
      </div>
    </div>
    <div class="actions">
      <button type="button" class="btn danger" id="delete">Delete</button>
      <div class="spacer"></div>
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="delDlg" class="small">
  <form method="dialog">
    <h2>Delete repeating event</h2>
    <p id="delText"></p>
    <div class="actions">
      <button value="cancel" class="btn">Cancel</button>
      <div class="spacer"></div>
      <button value="one" class="btn danger">This event</button>
      <button value="all" class="btn danger">All events</button>
    </div>
  </form>
</dialog>

<script>
const LEGACY_STORE = "weekboard.events.v1";  // browser-only storage from before the server API; uploaded once
const PALETTE = ["#7c9cff", "#5ed6b4", "#ffb86b", "#ff7a9c", "#b18cff", "#4fc3f7", "#f5d76e", "#a0a8b8"];
const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
// Font Awesome Free (solid) icon names offered in the event form, by group
const ICONS = [
  ["Health & fitness", [["dumbbell", "Gym"], ["person-running", "Run"], ["person-biking", "Bike"], ["person-swimming", "Swim"], ["spa", "Yoga / spa"], ["heart-pulse", "Health"], ["stethoscope", "Doctor"], ["tooth", "Dentist"], ["eye", "Eye doctor"], ["comments", "Therapy"], ["pills", "Medication"], ["bed", "Rest"]]],
  ["Food & errands", [["utensils", "Meal"], ["mug-hot", "Coffee"], ["burger", "Takeout"], ["pizza-slice", "Pizza"], ["wine-glass", "Drinks"], ["cart-shopping", "Shopping"]]],
  ["Work & study", [["briefcase", "Work"], ["laptop", "Computer"], ["video", "Video call"], ["phone", "Call"], ["envelope", "Email"], ["graduation-cap", "Class"], ["book", "Reading"], ["pen", "Writing"]]],
  ["Home", [["house", "Home"], ["broom", "Cleaning"], ["shirt", "Laundry"], ["screwdriver-wrench", "Repairs"], ["seedling", "Garden"], ["trash-can", "Trash day"]]],
  ["Travel", [["car", "Drive"], ["wrench", "Car service"], ["gas-pump", "Fuel"], ["plane", "Flight"], ["train", "Train"], ["bus", "Bus"], ["suitcase", "Trip"]]],
  ["Family & friends", [["users", "Friends"], ["children", "Kids"], ["baby", "Baby"], ["cake-candles", "Birthday"], ["gift", "Gift"], ["champagne-glasses", "Celebration"], ["heart", "Date"], ["church", "Church"]]],
  ["Pets", [["dog", "Dog"], ["cat", "Cat"], ["paw", "Pet care"]]],
  ["Money", [["money-bill", "Pay"], ["credit-card", "Card"], ["file-invoice-dollar", "Bill"], ["piggy-bank", "Savings"]]],
  ["Fun", [["music", "Music"], ["film", "Movie"], ["gamepad", "Games"], ["bullhorn", "Cheer"], ["futbol", "Soccer"], ["basketball", "Basketball"], ["golf-ball-tee", "Golf"], ["ticket", "Event"], ["camera", "Photos"], ["palette", "Art"]]],
  ["Other", [["bell", "Reminder"], ["star", "Important"], ["scissors", "Haircut"], ["calendar-check", "Appointment"], ["flag", "Deadline"]]],
];
// Also the allow-list for rendering: an unknown icon value (e.g. from another client) is ignored
const ICON_LABELS = Object.fromEntries(ICONS.flatMap(([, list]) => list));

// Event templates. `fields` are asked for in the form; `fill` turns the answers into the
// event title/icon/notes. Select options are [label, icon] so the choice can set the icon.
// A numeric `age` answer on a yearly template is stored as `since` so each year shows its count.
const TEMPLATES = [
  { id: "birthday", name: "Birthday", icon: "cake-candles", color: "#ff7a9c", repeat: "yearly",
    fields: [{ key: "who", label: "Name", placeholder: "Sam" }, { key: "age", label: "Turning (age)", type: "number" }],
    fill: v => ({ title: v.who ? `${v.who}'s birthday` : "Birthday" }) },
  { id: "anniversary", name: "Anniversary", icon: "heart", color: "#ff7a9c", repeat: "yearly",
    fields: [{ key: "who", label: "Whose", placeholder: "Mom & Dad" }, { key: "age", label: "Celebrating (years)", type: "number" }],
    fill: v => ({ title: v.who ? `${v.who}'s anniversary` : "Anniversary" }) },
  { id: "appointment", name: "Appointment", icon: "calendar-check", color: "#4fc3f7",
    fields: [
      { key: "type", label: "Type", options: [["Doctor", "stethoscope"], ["Dentist", "tooth"], ["Eye doctor", "eye"], ["Haircut", "scissors"], ["Car service", "wrench"], ["Vet", "paw"], ["Therapy", "comments"], ["Other", "calendar-check"]] },
      { key: "where", label: "With / where", placeholder: "Dr. Lee, Main St" }],
    fill: v => ({ title: `${v.type} appointment`, icon: v.typeIcon, notes: v.where }) },
  { id: "workout", name: "Workout", icon: "dumbbell", color: "#5ed6b4",
    fields: [{ key: "type", label: "Activity", options: [["Gym", "dumbbell"], ["Run", "person-running"], ["Bike", "person-biking"], ["Swim", "person-swimming"], ["Yoga", "spa"]] }],
    fill: v => ({ title: v.type, icon: v.typeIcon }) },
  { id: "bill", name: "Bill due", icon: "file-invoice-dollar", color: "#f5d76e", repeat: "monthly",
    fields: [{ key: "who", label: "Pay to", placeholder: "Electric company" }, { key: "amount", label: "Amount", placeholder: "$120" }],
    fill: v => ({ title: v.who ? `Pay ${v.who}` : "Pay bill", notes: v.amount && `Amount: ${v.amount}` }) },
  { id: "dinner", name: "Dinner plans", icon: "utensils", color: "#ffb86b", start: "18:30",
    fields: [{ key: "who", label: "With", placeholder: "Friends" }, { key: "where", label: "Where", placeholder: "Restaurant" }],
    fill: v => ({ title: v.who ? `Dinner with ${v.who}` : "Dinner", notes: v.where }) },
  { id: "trip", name: "Trip", icon: "plane", color: "#b18cff",
    fields: [{ key: "where", label: "Destination", placeholder: "Denver" }, { key: "type", label: "By", options: [["Flight", "plane"], ["Train", "train"], ["Drive", "car"], ["Bus", "bus"]] }],
    fill: v => ({ title: v.where ? `${v.type} to ${v.where}` : v.type, icon: v.typeIcon }) },
  { id: "call", name: "Call", icon: "phone", color: "#7c9cff",
    fields: [{ key: "who", label: "Who", placeholder: "Mom" }],
    fill: v => ({ title: v.who ? `Call ${v.who}` : "Call" }) },
  { id: "medication", name: "Medication", icon: "pills", color: "#a0a8b8", repeat: "daily", start: "08:00",
    fields: [{ key: "who", label: "Medication", placeholder: "Vitamin D" }],
    fill: v => ({ title: v.who ? `Take ${v.who}` : "Take medication" }) },
];

let events = [];
let weekStart = mondayOf(new Date());
let editingId = null;
let editingDate = null;  // which occurrence was opened (matters for recurring events)
let pickedColor = PALETTE[0];

// Server storage. Each changed event is saved on its own (so edits from two devices
// don't clobber each other), and writes go out one at a time so rapid edits land in order.
let queue = Promise.resolve();
let pending = 0;
let offline = false;
function setOffline(v) { offline = v; document.getElementById("offline").hidden = !v; }
function send(method, e) {
  pending++;
  queue = queue
    .then(() => fetch(`/api/events/${e.id}`, method === "PUT"
      ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(e) }
      : { method }))
    .then(res => { if (!res.ok) throw new Error(res.status); setOffline(false); })
    .catch(() => setOffline(true))
    .finally(() => pending--);
}
function save(...changed) { changed.forEach(e => send("PUT", e)); }
function destroy(e) { send("DELETE", e); }

async function fetchEvents() {
  const res = await fetch("/api/events", { cache: "no-store" });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}
// Pick up changes made on other devices. Skipped mid-edit so the board doesn't jump under you.
// ponytail: edits that failed to save while offline are replaced by server data on the next sync
async function sync() {
  if (pending || dlg.open || delDlg.open || document.querySelector(".dragging")) return;
  try {
    const fresh = await fetchEvents();
    setOffline(false);
    if (pending) return;  // a local edit started while fetching; the next sync gets it
    if (JSON.stringify(fresh) !== JSON.stringify(events)) { events = fresh; render(); }
  } catch { setOffline(true); }
}

function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
// Local yyyy-mm-dd (toISOString would shift to UTC)
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function fmtTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  return `${((h + 11) % 12) + 1}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`;
}
// crypto.randomUUID needs Chromium 92+; older tablet browsers get an equivalent random hex id
function newId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join("");
}
function parse(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function diffDays(a, b) { return Math.round((parse(a) - parse(b)) / 864e5); }  // round absorbs DST hour

// Recurring events are stored once as a series: `date` is the first occurrence,
// `skip` lists deleted/moved occurrences, `doneDates` tracks completion per occurrence.
function occursOn(e, day) {
  if (!e.repeat) return e.date === day;
  if (day < e.date || (e.until && day > e.until) || e.skip?.includes(day)) return false;
  const d = parse(day), s = parse(e.date);
  // Weekly series repeat on `days` (0 = Sun); older events without it use the start's weekday
  const onDay = (e.days?.length ? e.days : [s.getDay()]).includes(d.getDay());
  const weeks = diffDays(iso(mondayOf(d)), iso(mondayOf(s))) / 7;
  switch (e.repeat) {
    case "daily": return true;
    case "weekdays": return d.getDay() % 6 !== 0;
    case "weekly": return onDay;
    case "biweekly": return onDay && weeks % 2 === 0;
    // ponytail: months lacking the start date (e.g. the 31st) are skipped, not clamped to month end
    case "monthly": return d.getDate() === s.getDate();
    case "monthlyNth": return d.getDay() === s.getDay() && nthOf(d) === nthOf(s);
    case "monthlyLast": return d.getDay() === s.getDay() && isLastOf(d);
    // ponytail: Feb 29 events only appear in leap years
    case "yearly": return d.getMonth() === s.getMonth() && d.getDate() === s.getDate();
  }
  return false;
}
function nthOf(d) { return Math.ceil(d.getDate() / 7); }  // 1st..5th weekday of its kind in the month
function isLastOf(d) { return addDays(d, 7).getMonth() !== d.getMonth(); }
function isDone(e, day) { return e.repeat ? !!e.doneDates?.includes(day) : !!e.done; }
function setDone(e, day, v) {
  if (!e.repeat) { e.done = v; return; }
  e.doneDates = (e.doneDates || []).filter(x => x !== day);
  if (v) e.doneDates.push(day);
}
// Split one occurrence off a series into a standalone event
function detach(e, day, changes) {
  const copy = { ...e, id: newId(), date: day, done: isDone(e, day), repeat: "", until: "", skip: [], doneDates: [], ...changes };
  e.skip = [...(e.skip || []), day];
  events.push(copy);
  return copy;
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

function render() {
  const todayIso = iso(new Date());
  const end = addDays(weekStart, 6);
  const opts = { month: "short", day: "numeric" };
  document.getElementById("weekRange").textContent =
    `${weekStart.toLocaleDateString(undefined, opts)} - ${end.toLocaleDateString(undefined, { ...opts, year: "numeric" })}`;
  const offset = Math.round((weekStart - mondayOf(new Date())) / 864e5 / 7);
  document.getElementById("weekTitle").textContent =
    offset === 0 ? "This Week" : offset === 1 ? "Next Week" : offset === -1 ? "Last Week" : "Week";

  const board = document.getElementById("board");
  board.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const day = addDays(weekStart, i);
    const dayIso = iso(day);
    // All-day (no time) first, then by start time
    const list = events.filter(e => occursOn(e, dayIso))
      .sort((a, b) => (a.start || "").localeCompare(b.start || ""));

    const col = document.createElement("section");
    col.className = "column" + (dayIso === todayIso ? " today" : "");
    col.dataset.date = dayIso;
    col.innerHTML = `
      <div class="col-head">
        <span class="dow">${DOW[i]}</span><span class="num">${day.getDate()}</span>
        <span class="count">${list.length ? `${list.filter(e => isDone(e, dayIso)).length}/${list.length}` : ""}</span>
        <button class="add" title="Add event" aria-label="Add event"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
      </div>
      <div class="cards"></div>`;
    col.querySelector(".add").onclick = () => openEditor(null, dayIso);
    const cards = col.querySelector(".cards");
    list.forEach(e => cards.appendChild(cardEl(e, dayIso)));

    board.appendChild(col);
  }
}

function cardEl(e, day) {
  const done = isDone(e, day);
  const el = document.createElement("article");
  el.className = "card" + (done ? " done" : "");
  const color = /^#[0-9a-f]{6}$/i.test(e.color) ? e.color : PALETTE[0];  // also keeps stored values out of the HTML below
  setCardColor(el, color);
  const years = Number.isInteger(e.since) ? parse(day).getFullYear() - e.since : 0;  // age / anniversary count
  const when = e.start ? fmtTime(e.start) + (e.end ? ` - ${fmtTime(e.end)}` : "") : "All day";
  el.innerHTML = `
    <input type="checkbox" class="check" ${done ? "checked" : ""} aria-label="Mark complete">
    <div class="when">${when}${e.repeat ? `<i class="fa-solid fa-repeat repeat" title="Repeats"></i>` : ""}</div>
    <div class="name">${ICON_LABELS[e.icon] ? `<i class="fa-solid fa-${e.icon} ev-icon" aria-hidden="true"></i>` : ""}${esc(e.title)}${years > 0 ? ` <span class="years">(${years})</span>` : ""}</div>
    ${e.notes ? `<div class="notes">${esc(e.notes)}</div>` : ""}
    <div class="tools">
      <label title="Color"><span class="swatch-dot"></span><input type="color" value="${color}"></label>
      <button class="edit" title="Edit" aria-label="Edit"><i class="fa-solid fa-pen" aria-hidden="true"></i></button>
      <button class="del" title="Delete" aria-label="Delete"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>`;

  el.querySelector(".check").onchange = ev => { setDone(e, day, ev.target.checked); save(e); render(); };
  const picker = el.querySelector("input[type=color]");
  picker.oninput = () => setCardColor(el, picker.value);  // live preview
  picker.onchange = () => { e.color = picker.value; save(e); };
  el.querySelector(".edit").onclick = () => openEditor(e, day);
  el.querySelector(".del").onclick = () => {
    if (!e.repeat) { if (confirm(`Delete "${e.title}"?`)) remove(e, day, true); return; }
    $("delText").textContent = `Delete "${e.title}" on this day only, or every occurrence?`;
    delDlg.returnValue = "cancel";  // Esc keeps this
    delDlg.onclose = () => { if (delDlg.returnValue !== "cancel") remove(e, day, delDlg.returnValue === "all"); };
    delDlg.showModal();
  };
  // Tap/click a card to edit it (ignoring the click that ends a drag)
  el.onclick = ev => { if (!ev.target.closest(".tools, .check") && Date.now() - lastDragEnd > 300) openEditor(e, day); };
  el.onpointerdown = ev => dragStart(ev, e, day, el);
  el.oncontextmenu = ev => ev.preventDefault();  // Android long-press would open a menu
  return el;
}
function setCardColor(el, hex) {
  el.style.setProperty("--c", hex);
  el.style.setProperty("--c-rgb", [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(","));
}

// Drag a card to another day, with mouse or touch (HTML5 drag-and-drop doesn't work on touchscreens).
// Touch starts after a short long-press so ordinary swipes still scroll; mouse starts after a few pixels.
let drag = null;
let lastDragEnd = 0;
function dragStart(ev, e, day, el) {
  if (ev.button > 0 || ev.target.closest(".tools, .check")) return;
  drag = { e, from: day, el, x: ev.clientX, y: ev.clientY, active: false, touch: ev.pointerType !== "mouse" };
  if (drag.touch) drag.timer = setTimeout(beginDrag, 350);
}
function beginDrag() {
  const r = drag.el.getBoundingClientRect();
  const ghost = drag.el.cloneNode(true);
  ghost.classList.add("ghost");
  ghost.style.width = r.width + "px";
  document.body.appendChild(ghost);
  Object.assign(drag, { active: true, ghost, dx: drag.x - r.left, dy: drag.y - r.top });
  drag.el.classList.add("dragging");
  if (navigator.vibrate) navigator.vibrate(15);
  moveGhost();
  requestAnimationFrame(autoScroll);
}
function moveGhost() {
  drag.ghost.style.left = drag.x - drag.dx + "px";
  drag.ghost.style.top = drag.y - drag.dy + "px";
  const col = document.elementFromPoint(drag.x, drag.y)?.closest(".column");
  if (col !== drag.over) {
    drag.over?.classList.remove("drag-over");
    col?.classList.add("drag-over");
    drag.over = col;
  }
}
// In the stacked (narrow) layout, holding a card near the top/bottom edge scrolls the board
function autoScroll() {
  if (!drag?.active) return;
  const board = $("board"), r = board.getBoundingClientRect();
  if (drag.y < r.top + 60) board.scrollTop -= 12;
  else if (drag.y > r.bottom - 60) board.scrollTop += 12;
  moveGhost();
  requestAnimationFrame(autoScroll);
}
function endDrag(drop) {
  if (!drag) return;
  clearTimeout(drag.timer);
  const d = drag;
  drag = null;
  if (!d.active) return;
  d.ghost.remove();
  lastDragEnd = Date.now();
  const to = drop && d.over?.dataset.date;
  if (to && to !== d.from) {
    // Dragging a recurring occurrence moves just that one
    if (d.e.repeat) save(d.e, detach(d.e, d.from, { date: to }));
    else { d.e.date = to; save(d.e); }
  }
  render();
}
document.addEventListener("pointermove", ev => {
  if (!drag) return;
  if (!drag.active) {
    if (Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) < 8) return;
    if (drag.touch) { clearTimeout(drag.timer); drag = null; return; }  // finger moved before the long-press: a scroll
    beginDrag();
  }
  drag.x = ev.clientX;
  drag.y = ev.clientY;
  moveGhost();
});
document.addEventListener("pointerup", () => endDrag(true));
document.addEventListener("pointercancel", () => endDrag(false));
// While a touch drag is active, stop the browser from scrolling (and cancelling the pointer)
document.addEventListener("touchmove", ev => { if (drag?.active) ev.preventDefault(); }, { passive: false });

// Callers confirm first
function remove(e, day, all) {
  if (e.repeat && !all) { e.skip = [...(e.skip || []), day]; save(e); }
  else { events = events.filter(x => x !== e); destroy(e); }
  render();
}

// Editor
const dlg = document.getElementById("editor");
const delDlg = document.getElementById("delDlg");
const $ = id => document.getElementById(id);

function renderSwatches() {
  const wrap = $("swatches");
  wrap.innerHTML = "";
  PALETTE.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.style.background = c;
    b.className = c === pickedColor ? "sel" : "";
    b.onclick = () => { pickedColor = c; renderSwatches(); };
    wrap.appendChild(b);
  });
  const custom = document.createElement("input");
  custom.type = "color";
  custom.value = pickedColor;
  custom.title = "Custom color";
  custom.oninput = () => { pickedColor = custom.value; wrap.querySelectorAll("button").forEach(b => b.className = ""); };
  wrap.appendChild(custom);
}

const scope = () => $("form").elements.scope.value;
const editing = () => events.find(x => x.id === editingId);

// Repeat settings only make sense for new events, one-offs, or "All events"
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
let pickedDays = [];
const formDay = () => ($("fDate").value ? parse($("fDate").value) : new Date()).getDay();

function updateRepeatUI() {
  const hide = editing()?.repeat && scope() === "one";
  const r = $("fRepeat").value;
  $("repeatRow").style.display = hide ? "none" : "";
  $("untilField").style.visibility = r ? "" : "hidden";
  $("daysField").style.display = !hide && (r === "weekly" || r === "biweekly") ? "" : "none";
  // Monthly option labels depend on the chosen date
  const d = $("fDate").value ? parse($("fDate").value) : new Date();
  const opt = v => $("fRepeat").querySelector(`[value=${v}]`);
  opt("monthly").textContent = `Monthly on day ${d.getDate()}`;
  opt("monthlyNth").textContent = `Monthly on the ${["1st", "2nd", "3rd", "4th", "5th"][nthOf(d) - 1]} ${DAY_NAMES[d.getDay()]}`;
  opt("monthlyLast").textContent = `Monthly on the last ${DAY_NAMES[d.getDay()]}`;
  opt("monthlyLast").hidden = !isLastOf(d);
  opt("yearly").textContent = `Yearly on ${d.toLocaleDateString(undefined, { month: "long", day: "numeric" })}`;
  renderDays();
}
function renderDays() {
  const wrap = $("days");
  wrap.innerHTML = "";
  [1, 2, 3, 4, 5, 6, 0].forEach(n => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = DAY_NAMES[n].slice(0, 3);
    b.className = pickedDays.includes(n) ? "sel" : "";
    b.onclick = () => { pickedDays = pickedDays.includes(n) ? pickedDays.filter(x => x !== n) : [...pickedDays, n]; renderDays(); };
    wrap.appendChild(b);
  });
}
$("fRepeat").onchange = updateRepeatUI;
// A single picked weekday follows the date; a custom multi-day pick is left alone
$("fDate").onchange = () => { if (pickedDays.length <= 1) pickedDays = [formDay()]; updateRepeatUI(); };
document.querySelectorAll("input[name=scope]").forEach(r => r.onchange = updateRepeatUI);

function openEditor(e, date) {
  editingId = e ? e.id : null;
  editingDate = date;
  $("formTitle").textContent = e ? "Edit event" : "New event";
  $("fTitle").value = e?.title || "";
  $("fDate").value = date || iso(new Date() >= weekStart && new Date() < addDays(weekStart, 7) ? new Date() : weekStart);
  $("fStart").value = e?.start || "";
  $("fEnd").value = e?.end || "";
  $("fNotes").value = e?.notes || "";
  $("fRepeat").value = e?.repeat || "";
  $("fUntil").value = e?.until || "";
  $("form").elements.scope.value = "one";
  $("scopeField").style.display = e?.repeat ? "" : "none";
  pickedDays = e?.days?.length ? [...e.days] : [e ? parse(e.date).getDay() : formDay()];
  pickedColor = e?.color || PALETTE[0];
  setIcon(e?.icon || "");
  $("delete").style.display = e ? "" : "none";
  $("tplPicker").hidden = !!e;
  pickTemplate(null);
  renderSwatches();
  updateRepeatUI();
  dlg.showModal();
  $("fTitle").focus();
}

$("form").onsubmit = () => {
  const data = {
    title: $("fTitle").value.trim(),
    date: $("fDate").value,
    start: $("fStart").value,
    end: $("fEnd").value,
    notes: $("fNotes").value.trim(),
    color: pickedColor,
    icon: pickedIcon,
    repeat: $("fRepeat").value,
    until: $("fRepeat").value ? $("fUntil").value : "",
    days: ["weekly", "biweekly"].includes($("fRepeat").value) ? (pickedDays.length ? [...pickedDays].sort() : [formDay()]) : [],
  };
  const e = editing();
  if (!e) {
    const age = tpl ? parseInt(tplValues().age, 10) : NaN;
    if (data.repeat === "yearly" && age >= 0 && age <= 150) data.since = parse(data.date).getFullYear() - age;
    const created = { id: newId(), done: false, skip: [], doneDates: [], ...data };
    events.push(created);
    save(created);
  }
  else if (e.repeat && scope() === "one") save(e, detach(e, editingDate, { ...data, repeat: "", until: "" }));
  else {
    // Editing a whole series from one occurrence: shift the series start by however far that occurrence moved
    if (e.repeat && data.repeat) {
      const shift = d => iso(addDays(parse(d), diffDays(data.date, editingDate)));
      Object.assign(data, { date: shift(e.date), skip: (e.skip || []).map(shift), doneDates: (e.doneDates || []).map(shift) });
    }
    Object.assign(e, data);
    save(e);
  }
  render();
};
$("cancel").onclick = () => dlg.close();

// Icon dropdown
let pickedIcon = "";
const iconHtml = (name, label) =>
  `<span class="icon-slot">${name ? `<i class="fa-solid fa-${name}" aria-hidden="true"></i>` : ""}</span><span>${label}</span>`;
function setIcon(name) {
  pickedIcon = ICON_LABELS[name] ? name : "";
  $("iconBtn").innerHTML = iconHtml(pickedIcon, pickedIcon ? ICON_LABELS[pickedIcon] : "No icon") +
    `<i class="fa-solid fa-chevron-down caret" aria-hidden="true"></i>`;
  $("iconMenu").querySelectorAll("[role=option]").forEach(o => o.setAttribute("aria-selected", o.dataset.icon === pickedIcon));
}
function toggleIconMenu(open) {
  $("iconMenu").hidden = !open;
  $("iconBtn").setAttribute("aria-expanded", open);
  if (open) ($("iconMenu").querySelector("[aria-selected=true]") || $("iconMenu").querySelector("button")).focus();
}
$("iconMenu").innerHTML =
  `<button type="button" role="option" class="icon-opt none" data-icon="">${iconHtml("", "No icon")}</button>` +
  ICONS.map(([group, list]) => `<div class="icon-group">${group}</div><div class="icon-grid">` +
    list.map(([name, label]) => `<button type="button" role="option" class="icon-opt" data-icon="${name}">${iconHtml(name, label)}</button>`).join("") +
    `</div>`).join("");
$("iconBtn").onclick = () => toggleIconMenu($("iconMenu").hidden);
$("iconMenu").onclick = ev => {
  const opt = ev.target.closest("[role=option]");
  if (!opt) return;
  setIcon(opt.dataset.icon);
  toggleIconMenu(false);
  $("iconBtn").focus();
};
// Click outside closes the menu; Esc closes the menu before it would close the dialog
// Template menu (new events only)
let tpl = null;
function toggleTplMenu(open) {
  $("tplMenu").hidden = !open;
  $("tplBtn").setAttribute("aria-expanded", open);
  if (open) $("tplMenu").querySelector("button").focus();
}
function tplValues() {
  const v = {};
  tpl.fields.forEach(f => {
    v[f.key] = $("tpl-" + f.key).value.trim();
    if (f.options) v.typeIcon = f.options.find(([label]) => label === v[f.key])?.[1];
  });
  return v;
}
function applyTemplate() {
  const out = tpl.fill(tplValues());
  $("fTitle").value = out.title;
  setIcon(out.icon || tpl.icon);
  if ("notes" in out) $("fNotes").value = out.notes || "";
}
function pickTemplate(t) {
  tpl = t;
  $("tplBox").hidden = !t;
  toggleTplMenu(false);
  if (!t) return;
  $("tplName").innerHTML = `<i class="fa-solid fa-${t.icon}" aria-hidden="true"></i>${t.name}`;
  $("tplFields").innerHTML = t.fields.map(f => `<div class="field"><label for="tpl-${f.key}">${f.label}</label>${f.options
    ? `<select id="tpl-${f.key}">${f.options.map(([label]) => `<option>${label}</option>`).join("")}</select>`
    : `<input id="tpl-${f.key}" autocomplete="off" placeholder="${f.placeholder || ""}"${f.type === "number" ? ' type="number" min="0" max="150" inputmode="numeric"' : ""}>`}</div>`).join("");
  $("tplFields").querySelectorAll("input, select").forEach(el => el.oninput = el.onchange = applyTemplate);
  pickedColor = t.color;
  renderSwatches();
  $("fRepeat").value = t.repeat || "";
  $("fStart").value = t.start || "";
  $("fEnd").value = "";
  updateRepeatUI();
  applyTemplate();
  $("tplFields").querySelector("input, select").focus();
}
$("tplMenu").innerHTML = TEMPLATES.map(t =>
  `<button type="button" role="menuitem" class="icon-opt" data-tpl="${t.id}">${iconHtml(t.icon, t.name)}</button>`).join("");
$("tplBtn").onclick = () => toggleTplMenu($("tplMenu").hidden);
$("tplMenu").onclick = ev => {
  const b = ev.target.closest("[data-tpl]");
  if (b) pickTemplate(TEMPLATES.find(t => t.id === b.dataset.tpl));
};
$("tplClear").onclick = () => { pickTemplate(null); $("fTitle").focus(); };

// Click outside closes a menu; Esc closes an open menu before it would close the dialog
dlg.addEventListener("click", ev => {
  if (!ev.target.closest(".icon-picker")) toggleIconMenu(false);
  if (!ev.target.closest(".tpl-picker")) toggleTplMenu(false);
});
dlg.addEventListener("cancel", ev => {
  if ($("iconMenu").hidden && $("tplMenu").hidden) return;
  ev.preventDefault();
  toggleIconMenu(false);
  toggleTplMenu(false);
});
dlg.addEventListener("close", () => { toggleIconMenu(false); toggleTplMenu(false); });
$("delete").onclick = () => {
  const e = editing(), all = !e.repeat || scope() === "all";
  const msg = !e.repeat ? `Delete "${e.title}"?` : all ? `Delete every "${e.title}" event?` : `Delete "${e.title}" on this day only?`;
  if (!confirm(msg)) return;
  remove(e, editingDate, all);
  dlg.close();
};

// Header controls
$("prev").onclick = () => { weekStart = addDays(weekStart, -7); render(); };
$("next").onclick = () => { weekStart = addDays(weekStart, 7); render(); };
$("today").onclick = () => { weekStart = mondayOf(new Date()); render(); };
$("newEvent").onclick = () => openEditor(null);
// Older Android browsers only have the webkit-prefixed fullscreen API
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
$("fullscreen").onclick = () => {
  const root = document.documentElement;
  if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
};
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $("fullscreen").hidden = true;
const syncFsIcon = () => $("fullscreen").innerHTML = `<i class="fa-solid fa-${fsElement() ? "compress" : "expand"}" aria-hidden="true"></i>`;
document.addEventListener("fullscreenchange", syncFsIcon);
document.addEventListener("webkitfullscreenchange", syncFsIcon);
// Theme is a per-device preference
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").innerHTML = `<i class="fa-solid fa-${t === "light" ? "moon" : "sun"}" aria-hidden="true"></i>`;  // the mode you'd switch to
  try { localStorage.setItem("weekboard.theme", t); } catch {}
}
let savedTheme = "dark";
try { savedTheme = localStorage.getItem("weekboard.theme") || "dark"; } catch {}
setTheme(savedTheme);
$("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");

// Clock; also re-render when the day rolls over so "today" highlight moves
let lastDay = iso(new Date());
function tick() {
  const now = new Date();
  $("clockTime").textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  $("clockDate").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  if (iso(now) !== lastDay) { lastDay = iso(now); weekStart = mondayOf(now); render(); }
}
setInterval(tick, 1000);
tick();
render();

// Load from the server. If it has nothing yet, upload whatever this browser stored before
// server storage existed, then forget the local copy once the upload succeeds.
(async () => {
  try {
    events = await fetchEvents();
    let legacy = [];
    try { legacy = JSON.parse(localStorage.getItem(LEGACY_STORE)) || []; } catch {}
    if (!events.length && legacy.length) {
      events = legacy;
      save(...legacy);
      queue.then(() => { if (!offline) try { localStorage.removeItem(LEGACY_STORE); } catch {} });
    }
    render();
  } catch { setOffline(true); }
  setInterval(sync, 30000);
})();

// Open index.html#selftest and check the console
if (location.hash === "#selftest") {
  const s = { date: "2026-10-12", repeat: "weekly", skip: ["2026-10-26"] };  // a Monday
  const t = (cond, msg) => console.assert(cond, msg) || cond;
  const ok = [
    t(occursOn(s, "2026-10-19") && !occursOn(s, "2026-10-20"), "weekly"),
    t(!occursOn(s, "2026-10-05"), "nothing before start"),
    t(!occursOn(s, "2026-10-26"), "skipped date"),
    t(occursOn({ ...s, repeat: "biweekly" }, "2026-11-09") && !occursOn({ ...s, repeat: "biweekly" }, "2026-11-02"), "biweekly"),
    t(occursOn({ ...s, repeat: "weekdays" }, "2026-10-16") && !occursOn({ ...s, repeat: "weekdays" }, "2026-10-17"), "weekdays"),
    t(occursOn({ ...s, repeat: "monthly" }, "2026-11-12") && !occursOn({ ...s, repeat: "monthly" }, "2026-11-13"), "monthly"),
    t(!occursOn({ ...s, until: "2026-10-31" }, "2026-11-02"), "until"),
    t(occursOn({ ...s, days: [1, 3] }, "2026-10-14") && !occursOn({ ...s, days: [1, 3] }, "2026-10-13"), "weekly on Mon+Wed"),
    t(occursOn({ ...s, repeat: "biweekly", days: [1, 3] }, "2026-10-28") && !occursOn({ ...s, repeat: "biweekly", days: [1, 3] }, "2026-10-21"), "biweekly on Mon+Wed"),
    t(occursOn({ ...s, repeat: "monthlyNth" }, "2026-11-09") && !occursOn({ ...s, repeat: "monthlyNth" }, "2026-11-16"), "2nd Monday"),
    t(occursOn({ ...s, date: "2026-10-26", repeat: "monthlyLast" }, "2026-11-30") && !occursOn({ ...s, date: "2026-10-26", repeat: "monthlyLast" }, "2026-11-23"), "last Monday"),
    t(occursOn({ ...s, repeat: "yearly" }, "2027-10-12") && !occursOn({ ...s, repeat: "yearly" }, "2026-11-12"), "yearly"),
    t(diffDays("2026-11-02", "2026-10-26") === 7, "diff across DST"),
  ].every(Boolean);
  console.log(ok ? "selftest passed" : "selftest FAILED");
}
